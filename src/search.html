<!DOCTYPE html>
<html lang="ja" data-theme-setting="system">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Shortcut Finder</title>
		<link rel="stylesheet" href="search.css">
	</head>
	<body>
		<div id="app">
			<!-- 検索バー -->
			<div class="search-container" id="search-container">
				<div class="search-icon">
					<svg
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<circle cx="11" cy="11" r="8"></circle>
						<path d="m21 21-4.35-4.35"></path>
					</svg>
				</div>
				<div class="detected-app" id="detected-app">
					<span class="detected-app-name" id="active-app-name">-</span>
				</div>
				<input
					type="text"
					id="search-input"
					placeholder="ショートカットを検索..."
					autocomplete="off"
				>
			</div>

			<!-- 検索結果 -->
			<div class="results-container" id="results-container">
				<div class="results-list" id="results-list"></div>
				<div class="no-results" id="no-results" style="display: none;">
					<div class="no-results-icon">🔍</div>
					<p>検索結果が見つかりません</p>
					<p class="no-results-hint">別のキーワードで検索してみてください</p>
				</div>
			</div>

			<!-- フッター -->
			<div class="footer">
				<div class="footer-hint">
					<span class="key-hint">↑↓</span>移動
					<span class="key-hint">Enter</span>選択
					<span class="key-hint">Esc</span>閉じる
				</div>
				<div class="footer-actions">
					<button
						class="theme-toggle"
						id="theme-toggle"
						title="テーマを切り替え"
					>
						<!-- システム -->
						<svg
							class="icon-system"
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						>
							<rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
							<line x1="8" y1="21" x2="16" y2="21"></line>
							<line x1="12" y1="17" x2="12" y2="21"></line>
						</svg>
						<!-- 太陽（ライト） -->
						<svg
							class="icon-sun"
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						>
							<circle cx="12" cy="12" r="5"></circle>
							<line x1="12" y1="1" x2="12" y2="3"></line>
							<line x1="12" y1="21" x2="12" y2="23"></line>
							<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
							<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
							<line x1="1" y1="12" x2="3" y2="12"></line>
							<line x1="21" y1="12" x2="23" y2="12"></line>
							<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
							<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
						</svg>
						<!-- 月（ダーク） -->
						<svg
							class="icon-moon"
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						>
							<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
						</svg>
					</button>
					<button
						class="config-btn"
						id="open-config-btn"
						title="ショートカット設定を開く"
					>
						<!-- キーボードアイコン -->
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
							<path d="M6 8h.001"></path>
							<path d="M10 8h.001"></path>
							<path d="M14 8h.001"></path>
							<path d="M18 8h.001"></path>
							<path d="M6 12h.001"></path>
							<path d="M10 12h.001"></path>
							<path d="M14 12h.001"></path>
							<path d="M18 12h.001"></path>
							<path d="M8 16h8"></path>
						</svg>
					</button>
					<button
						class="config-btn"
						id="open-settings-btn"
						title="アプリ設定を開く"
					>
						<!-- 歯車アイコン -->
						<svg
							width="14"
							height="14"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
						>
							<circle cx="12" cy="12" r="3"></circle>
							<path
								d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
							></path>
						</svg>
					</button>
				</div>
			</div>
		</div>

		<script type="module" src="search.js"></script>
	</body>
</html>
